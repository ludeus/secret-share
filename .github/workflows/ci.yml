name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Tests et qualité (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite
          coverage: none

      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit de sécurité des dépendances
        run: composer audit

      - name: Standard de codage
        run: composer cs-check

      - name: Analyse statique
        run: composer stan

      - name: Tests
        run: composer test

      - name: Shellcheck
        run: shellcheck install.sh unblock.sh check-token.sh docker/entrypoint.sh maintenance/monthly.sh maintenance/systemd/install.sh

      - name: Vulnérabilités des dépendances (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  # mesures publiées dans les badges du README ; ce job ne bloque jamais la CI
  report:
    name: Couverture et rapports
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
      cs: ${{ steps.cs.outcome }}
      audit: ${{ steps.audit.outcome }}
      trivy: ${{ steps.trivy.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite
          coverage: pcov

      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Couverture du code
        id: coverage
        continue-on-error: true
        run: |
          vendor/bin/phpunit --coverage-clover clover.xml --coverage-text
          # shellcheck disable=SC2016 # code PHP volontairement entre apostrophes
          php -r '$m = simplexml_load_file("clover.xml")->project->metrics;
            printf("percent=%.1f\n", 100 * (int)$m["coveredstatements"] / max(1, (int)$m["statements"]));' >> "$GITHUB_OUTPUT"

      - name: Standard de codage
        id: cs
        continue-on-error: true
        run: composer cs-check

      - name: Audit des dépendances
        id: audit
        continue-on-error: true
        run: composer audit

      - name: Vulnérabilités (Trivy)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      trivy: ${{ steps.trivy_image.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Tests dans l'image
        run: |
          docker build --target test -t secret-share:test .
          docker run --rm secret-share:test

      - name: Test de démarrage
        run: |
          docker build --target production -t secret-share:ci .
          docker run -d --name smoke -p 8080:8080 \
            -e APP_SECRET="$(openssl rand -base64 48)" -e APP_URL=http://localhost:8080 \
            --read-only --tmpfs /tmp --tmpfs /var/run/apache2:uid=33,gid=33 \
            --tmpfs /var/lock/apache2:uid=33,gid=33 --cap-drop ALL secret-share:ci
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'name="secret"'
          docker rm -f smoke

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests fonctionnels dans un navigateur
        run: |
          docker run -d --name e2e -p 8081:8080 \
            -e APP_SECRET="$(openssl rand -base64 48)" -e APP_URL=http://127.0.0.1:8081 \
            -e RATE_LIMIT_CREATE_PER_MINUTE=0 -e RATE_LIMIT_CREATE_PER_HOUR=0 -e RATE_LIMIT_READ_PER_MINUTE=0 \
            secret-share:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8081/health && break; sleep 1; done
          npm ci --prefix tests/e2e --no-audit --no-fund
          E2E_BASE_URL=http://127.0.0.1:8081 E2E_RATE_LIMIT_PAUSE=0 node tests/e2e/e2e.js
          docker rm -f e2e

      - name: Analyse de vulnérabilités (Trivy)
        id: trivy_image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          image-ref: secret-share:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Le conteneur refuse de démarrer sans APP_SECRET
        run: |
          if docker run --rm -e APP_URL=http://localhost secret-share:ci true; then
            echo "Le conteneur aurait dû refuser de démarrer" && exit 1
          fi

      - name: Métadonnées
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'ludeus/secret-share' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main

      - name: Connexion à Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publication
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # badges du README : fichiers JSON pour shields.io, publiés sur la branche « badges »
  badges:
    name: Badges
    runs-on: ubuntu-latest
    needs: [report, docker]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Publication des badges
        env:
          COVERAGE: ${{ needs.report.outputs.coverage }}
          CS: ${{ needs.report.outputs.cs }}
          AUDIT: ${{ needs.report.outputs.audit }}
          TRIVY_FS: ${{ needs.report.outputs.trivy }}
          TRIVY_IMAGE: ${{ needs.docker.outputs.trivy }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          badge() {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$2" "$3" "$4" > "$1.json"
          }
          mkdir badges && cd badges

          if [ -z "$COVERAGE" ]; then
            badge coverage couverture inconnue lightgrey
          else
            color=$(awk -v c="$COVERAGE" 'BEGIN { print (c >= 90) ? "brightgreen" : (c >= 75) ? "yellowgreen" : (c >= 60) ? "orange" : "red" }')
            badge coverage couverture "${COVERAGE} %" "$color"
          fi

          case "$CS" in
            success) badge cs "standard de codage" "PSR-12" brightgreen ;;
            failure) badge cs "standard de codage" "erreurs" red ;;
            *) badge cs "standard de codage" inconnu lightgrey ;;
          esac

          # sécurité : audit Composer et Trivy (sources et image), vulnérabilités HIGH/CRITICAL corrigeables
          if [ "$AUDIT" = success ] && [ "$TRIVY_FS" = success ] && [ "$TRIVY_IMAGE" = success ]; then
            badge security "sécurité" "aucune vulnérabilité" brightgreen
          elif [ "$AUDIT" = failure ] || [ "$TRIVY_FS" = failure ] || [ "$TRIVY_IMAGE" = failure ]; then
            badge security "sécurité" "vulnérabilités" red
          else
            badge security "sécurité" inconnu lightgrey
          fi

          git init -q -b badges
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Badges"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" badges
