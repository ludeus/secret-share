# Secret Share - hôte virtuel Apache

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30

# Nombre de processus borné : protège la mémoire du conteneur (voir mem_limit dans docker-compose.yml)
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 6
    MaxRequestWorkers 16
    MaxConnectionsPerChild 1000
</IfModule>

# Journal d'accès minimal : ni adresse IP, ni user-agent, ni referer.
# Les jetons des liens sont dans le fragment (#) et ne parviennent jamais au serveur.
LogFormat "%t \"%r\" %>s %B %{ms}T" secret_share_minimal
ErrorLog /proc/self/fd/2

<VirtualHost *:8080>
    DocumentRoot /app/public

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /app/public>
        Options None
        AllowOverride None
        Require all granted
        # toute URL qui n'est pas un fichier statique est traitée par l'application
        FallbackResource /index.php
    </Directory>

    # en-têtes des fichiers statiques (les réponses dynamiques sont gérées par PHP)
    <Directory /app/public/assets>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        Header always set Cache-Control "public, max-age=604800"
    </Directory>

    # ni la sonde de supervision ni les connexions internes d'Apache (« OPTIONS * ») ne polluent les journaux
    SetEnvIf Request_URI "^/health$" dontlog
    SetEnvIf Request_URI "^\*$" dontlog
    CustomLog /proc/self/fd/1 secret_share_minimal env=!dontlog
</VirtualHost>
