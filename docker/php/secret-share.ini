; Secret Share - configuration PHP durcie

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
enable_dl = Off

; 10 000 caractères UTF-8 au maximum par défaut : 1 Mo laisse une large marge
post_max_size = 1M
max_input_vars = 20
max_input_time = 10
max_execution_time = 15
; Argon2id (64 Mio par dérivation) alloue sa mémoire hors de memory_limit :
; le nombre de calculs simultanés est borné par ARGON2_CONCURRENCY
memory_limit = 128M

; aucune session PHP n'est utilisée
session.auto_start = 0
session.use_cookies = 0

variables_order = "EGPCS"

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
